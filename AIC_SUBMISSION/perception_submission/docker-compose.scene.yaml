services:
  model:
    command: --ros-args -p policy:=aic_submission.PlugAwarePolicy -p use_sim_time:=true
    environment:
      AIC_PLUG_AWARE_SCENE_MODEL: 1
      AIC_PLUG_AWARE_CHECKPOINT: /ws_aic/src/aic/runs/scene_pose_100ep/best_model.pt
      AIC_PLUG_AWARE_DEVICE: auto
      AIC_PLUG_AWARE_IMAGE_STRIDE: 4
      AIC_PLUG_AWARE_FILTER_ALPHA: 0.35
      AIC_PLUG_AWARE_PLUG_FILTER_ALPHA: 0.80
      AIC_PLUG_AWARE_CLAMP_PORT_Z: 1
      AIC_PLUG_AWARE_CLAMP_PORT_XY: 1
      AIC_PLUG_AWARE_FREEZE_PORT_AFTER: 0
      AIC_PLUG_AWARE_DEBUG_LOG_EVERY: 20
